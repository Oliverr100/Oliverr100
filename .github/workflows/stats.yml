name: High scores

# Redraws assets/stats.svg and assets/stats-m.svg from public GitHub activity.
on:
  schedule:
    - cron: "17 23 * * *"  # every day, 06:17 in Jakarta
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/stats/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the high scores panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/stats/stats.py

      - name: Commit the new panel if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-m.svg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update high scores"
            git push
          fi
